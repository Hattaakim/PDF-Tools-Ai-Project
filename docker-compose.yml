services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PAPERLY_PORT:-8080}:80"
    depends_on:
      office-converter:
        condition: service_healthy
    restart: unless-stopped

  office-converter:
    build:
      context: ./office-converter
      dockerfile: Dockerfile
    environment:
      PORT: "3001"
      CORS_ORIGIN: "*"
      CONVERSION_TIMEOUT_MS: "120000"
      MAX_OUTPUT_BYTES: "262144000"
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
